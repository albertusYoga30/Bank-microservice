services:
  config-server:
    image: "albertusyoga/config-server:v4"
    container_name: config-server-ms
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eureka-server:
    image: "albertusyoga/eureka-server:v4"
    container_name: eureka-server-ms
    ports:
      - "8070:8070"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eureka-server"

  accountsDB:
    container_name: accountsDB
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: SB_DB_ACCOUNTS
    extends:
      file: common-config.yml
      service: microservices-db-config

  loansDB:
    container_name: loansDB
    ports:
      - 3307:3306
    environment:
      MYSQL_DATABASE: SB_DB_LOANS
    extends:
      file: common-config.yml
      service: microservices-db-config

  cardsDB:
    container_name: cardsDB
    ports:
      - 3308:3306
    environment:
      MYSQL_DATABASE: SB_DB_CARDS
    extends:
      file: common-config.yml
      service: microservices-db-config

  accounts:
    image: "albertusyoga/accounts:v4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
      accountsDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsDB:3306/SB_DB_ACCOUNTS"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  loans:
    image: "albertusyoga/loans:v4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      loansDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_DATASOURCE_URL: "jdbc:mysql://loansDB:3306/SB_DB_LOANS"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  cards:
    image: "albertusyoga/cards:v4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      cardsDB:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsDB:3306/SB_DB_CARDS"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

networks:
  maltesepu:
    driver: "bridge"